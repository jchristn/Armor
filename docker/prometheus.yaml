# Prometheus for the Armor stack. Armor pushes OTLP to the collector, so the primary job scrapes the
# collector's Prometheus exporter. honor_labels keeps the job (service.name: armor-agent / armor-tui) and
# instance labels the exporter derives from each Armor process instead of overwriting them with the
# collector's own.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yaml

scrape_configs:
  - job_name: 'armor-otel-collector'
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  # Optional direct scrape of each process's in-process endpoint ("PrometheusEnabled": true in armor.json).
  # The endpoints bind 127.0.0.1 by default, which a container cannot reach; set "PrometheusHostname" to an
  # address reachable from Docker before enabling these jobs.
  # - job_name: 'armor-agent-direct'
  #   static_configs:
  #     - targets: ['host.docker.internal:9464']
  # - job_name: 'armor-tui-direct'
  #   static_configs:
  #     - targets: ['host.docker.internal:9465']
