name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/Armor.sln

      - name: Build
        run: dotnet build src/Armor.sln --no-restore --configuration Release

      - name: Run console tests (net10.0)
        run: dotnet run --project src/Test.Automated --framework net10.0 --configuration Release --no-build -- --results results.json

      - name: Run xUnit tests
        run: dotnet test src/Test.Xunit --framework net10.0 --configuration Release --no-build

      - name: Run NUnit tests
        run: dotnet test src/Test.Nunit --framework net10.0 --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: results.json
          if-no-files-found: ignore
